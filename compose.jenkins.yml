name: casastudio-jenkins

services:
  controller:
    build:
      context: ./infra/jenkins
      dockerfile: Dockerfile
    environment:
      CASC_JENKINS_CONFIG: /usr/share/jenkins/ref/casc/jenkins.yaml
      CASC_JENKINS_ADMIN_ID: ${CASC_JENKINS_ADMIN_ID:?Set CASC_JENKINS_ADMIN_ID in .env}
      CASC_JENKINS_ADMIN_PASSWORD: ${CASC_JENKINS_ADMIN_PASSWORD:?Set CASC_JENKINS_ADMIN_PASSWORD in .env}
      CASC_JENKINS_ADMIN_EMAIL: ${CASC_JENKINS_ADMIN_EMAIL:-admin@casastudio.local}
      JAVA_OPTS: -Djenkins.install.runSetupWizard=false
    ports:
      - "${CASC_JENKINS_HTTP_PORT:-8082}:8080"
      - "${CASC_JENKINS_AGENT_PORT:-50000}:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
    networks:
      - jenkins

  agent:
    build:
      context: ./infra/jenkins
      dockerfile: agent.Dockerfile
    depends_on:
      - controller
    environment:
      JENKINS_URL: http://controller:8080
      JENKINS_AGENT_NAME: casastudio-agent-node
      JENKINS_SECRET: ${CASC_JENKINS_AGENT_SECRET:-replace-with-generated-agent-secret}
      JENKINS_WEB_SOCKET: "true"
      JENKINS_AGENT_WORKDIR: /home/jenkins/agent
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - jenkins_agent_home:/home/jenkins
    networks:
      - jenkins
    restart: unless-stopped

networks:
  jenkins:
    driver: bridge

volumes:
  jenkins_home:
  jenkins_agent_home:
